<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <title>Nối từ Helper</title>
  <style>
    body { width: 320px; margin: 0; padding: 16px; color: #163b35; font: 14px/1.4 system-ui, sans-serif; }
    h1 { font-size: 18px; margin: 0 0 14px; }
    label { display: block; margin: 10px 0 4px; font-weight: 650; }
    input[type=text], input[type=password] { box-sizing: border-box; width: 100%; padding: 8px; border: 1px solid #aac9bf; border-radius: 8px; }
    .row { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: 12px 0; }
    button { border: 0; border-radius: 8px; padding: 8px 12px; background: #26d9ae; color: #07382d; cursor: pointer; font-weight: 700; }
    button.secondary { background: #e5f2ee; }
    #status { min-height: 20px; margin-top: 10px; white-space: pre-wrap; }
    .hint { color: #52716a; font-size: 12px; }
  </style>
</head>
<body>
  <h1>Nối từ Helper</h1>
  <label for="backend">Backend VPS URL</label>
  <input id="backend" type="text" placeholder="https://api.example.com">
  <label for="api-key">API key</label>
  <input id="api-key" type="password" autocomplete="off" placeholder="Docker secret API_KEY">
  <div class="hint">Lưu API key trong extension storage của trình duyệt này.</div>
  <div class="row"><span>Hiển thị gợi ý</span><input id="suggestions" type="checkbox"></div>
  <div class="row"><span>Chạy cron tự cào</span><input id="collector" type="checkbox"></div>
  <button id="save">Lưu cấu hình</button>
  <button id="refresh" class="secondary">Refresh trạng thái</button>
  <div id="status"></div>
  <script src="popup.js"></script>
</body>
</html>
